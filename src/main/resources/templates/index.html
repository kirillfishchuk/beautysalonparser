<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Warsaw Beauty Salons</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="light">

<div class="container">

    <header>
        <h1>Warsaw Beauty Salons</h1>

        <button id="themeToggle">
            🌙 Dark Mode
        </button>
    </header>

    <div class="toolbar">

        <div>
            Total salons:
            <strong th:text="${#lists.size(salons)}"></strong>
        </div>

        <input
                type="text"
                id="filterName"
                placeholder="Filter by name..."
        />

        <input
                type="text"
                id="filterDistrict"
                placeholder="Filter by district..."
        />

        <input
                type="number"
                id="filterRating"
                placeholder="Min rating..."
        />

        <input
                type="text"
                id="filterPrice"
                placeholder="Filter by price..."
        />

    </div>

    <table id="salonsTable">

        <thead>
        <tr>
            <th data-key="name">Name</th>
            <th data-key="district">District</th>
            <th data-key="address">Address</th>
            <th data-key="phone">Phone</th>
            <th data-key="website">Website</th>
            <th data-key="rating">Rating</th>
            <th data-key="reviews">Reviews</th>
            <th data-key="price">Price Range</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="salon : ${salons}"
            class="salon-row"

            th:data-id="${salon.id}"
            th:data-name="${salon.name}"
            th:data-district="${salon.district}"
            th:data-address="${salon.address}"
            th:data-phone="${salon.phone}"
            th:data-website="${salon.website}"
            th:data-rating="${salon.rating}"
            th:data-reviews="${salon.reviewsCount}"
            th:data-price="${salon.priceRange}">

            <td th:text="${salon.name}"></td>
            <td th:text="${salon.district}"></td>
            <td th:text="${salon.address}"></td>
            <td th:text="${salon.phone}"></td>

            <td>
                <a th:if="${salon.website != null}"
                   th:href="${salon.website}"
                   th:text="${salon.website}"
                   target="_blank"></a>
            </td>

            <td th:text="${salon.rating}"></td>
            <td th:text="${salon.reviewsCount}"></td>
            <td th:text="${salon.priceRange}"></td>

        </tr>

        </tbody>

    </table>

</div>

<div id="detailsModal" class="modal hidden">

    <div class="modal-content">

        <span class="close">&times;</span>

        <h2 id="modalName"></h2>

        <p><b>Address:</b> <span id="modalAddress"></span></p>
        <p><b>District:</b> <span id="modalDistrict"></span></p>
        <p><b>Phone:</b> <span id="modalPhone"></span></p>
        <p><b>Website:</b> <a id="modalWebsite" target="_blank"></a></p>
        <p><b>Rating:</b> <span id="modalRating"></span></p>
        <p><b>Reviews:</b> <span id="modalReviews"></span></p>
        <p><b>Price Range:</b> <span id="modalPrice"></span></p>

        <button disabled>Edit (coming soon)</button>

    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
